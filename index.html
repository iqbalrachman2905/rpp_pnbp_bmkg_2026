<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Layanan Semula-Menjadi</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-list-alt"></i> Katalog Layanan & Tarif (Semula - Menjadi)</h1>
            <p>Dashboard pencarian dan perbandingan tarif layanan</p>
        </header>

        <section class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Pencarian Lanjut (Nama Layanan, ID, dsb)...">
                <i class="fas fa-search"></i>
            </div>
            <div class="filters">
                <select id="kategoriFilter">
                    <option value="">Semua Kategori</option>
                    <option value="BARU">BARU</option>
                    <option value="UBAH">UBAH</option>
                    <option value="TETAP">TETAP</option>
                </select>
                <select id="sortFilter">
                    <option value="default">Urutkan: Default</option>
                    <option value="hargaAsc">Tarif Baru: Terendah ke Tertinggi</option>
                    <option value="hargaDesc">Tarif Baru: Tertinggi ke Terendah</option>
                    <option value="persenDesc">% Perubahan: Terbesar</option>
                </select>
            </div>
        </section>

        <main>
            <div class="table-container">
                <div class="loader" id="loader">Mengambil data dari Google Sheets...</div>
                <table id="dataTable" class="hidden">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Layanan</th>
                            <th>Kategori</th>
                            <th>Tarif Lama (Semula)</th>
                            <th>Tarif Baru (Menjadi)</th>
                            <th>Perubahan (%)</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
